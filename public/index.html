<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Pixel Battle</title>
<style>
  :root { font-family: Arial, sans-serif; color-scheme: light dark; }
  body { margin: 0; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  #replay { width: min(96vw, 70vh, 640px); aspect-ratio: 1; image-rendering: pixelated;
           border: 2px solid #888; touch-action: none; background: #fff; }
  #stage { width: min(96vw, 70vh, 640px); aspect-ratio: 1; overflow: hidden; border: 2px solid #888;
           touch-action: none; background: #fff; cursor: crosshair; }
  #board { width: 100%; height: 100%; display: block; image-rendering: pixelated; transform-origin: 0 0; }
  #zoom { display: flex; gap: 6px; align-items: center; font-size: 13px; }
  #zoom button { min-width: 36px; padding: 4px 8px; }
  #bar { width: min(96vw, 70vh, 640px); height: 10px; background: #8884; border-radius: 5px; overflow: hidden; }
  #fill { height: 100%; width: 0; background: #2a7; }
  #palette { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; width: min(96vw, 70vh, 640px); }
  #teams { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; width: min(96vw, 70vh, 640px); }
  .lbl { width: min(96vw, 70vh, 640px); font-size: 12px; opacity: .7; }
  #info { width: min(96vw, 70vh, 640px); display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; font-size: 13px; }
  #info i { width: 18px; height: 18px; border-radius: 3px; border: 1px solid #888; }
  .sw { aspect-ratio: 1; border: 2px solid transparent; border-radius: 4px; cursor: pointer; }
  .sw.sel { border-color: #000; outline: 2px solid #fff; }
  #tools { display: flex; gap: 6px; }
  #tools button { padding: 6px 12px; }
  #tools button.sel { font-weight: bold; outline: 2px solid #2a7; }
  #scores { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; font-size: 14px; }
  .score i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; }
  #rp { width: min(96vw, 70vh, 640px); font-size: 13px; text-align: center; }
  #status { font-size: 13px; opacity: .8; min-height: 1.2em; }
  #picker[hidden] { display: none; }
  #picker { position: fixed; inset: 0; background: #000c; display: flex; align-items: center; justify-content: center; z-index: 10; }
  #pickerBox { background: Canvas; color: CanvasText; padding: 16px; border-radius: 8px; width: min(92vw, 420px);
               display: flex; flex-direction: column; gap: 8px; }
  #teamBtns { display: flex; flex-direction: column; gap: 6px; }
  .teamBtn { display: flex; align-items: center; gap: 10px; padding: 10px; font-size: 15px; cursor: pointer; }
  .teamBtn i { width: 22px; height: 22px; border-radius: 4px; border: 1px solid #888; }
  .teamBtn span { margin-left: auto; opacity: .7; font-size: 13px; }
</style>
</head>
<body>
  <div id="status">Connecting...</div>
  <div id="stage"><canvas id="board" width="128" height="128"></canvas></div>
  <div id="zoom"><button id="zOut">&minus;</button><span id="zoomLabel">1x</span><button id="zIn">+</button><button id="zReset">Reset</button></div>
  <canvas id="replay" width="128" height="128" hidden></canvas>
  <div id="rp" hidden>
    <button id="rpPlay">Pause</button> <button id="rpRestart">Restart</button>
    <select id="rpSpeed"><option value="4">Slow</option><option value="10" selected>Normal</option><option value="40">Fast</option><option value="150">Very fast</option></select>
    <button id="rpExport">Export video</button> <button id="rpClose">Close</button><br>
    <input id="rpSlider" type="range" min="0" max="0" value="0" style="width:100%">
    <div id="rpLabel"></div>
  </div>
  <div id="bar"><div id="fill"></div></div>
  <div id="tools"></div>
  <div><button id="undo">Undo my last action</button> <button id="savePng">Save PNG</button> <button id="newGame">New game</button></div>
  <div id="poly" hidden><button id="finish">Finish</button> <button id="cancel">Cancel</button></div>
  <div id="info"></div>
  <div class="lbl">Palette</div>
  <div id="palette"></div>
  <div class="lbl">Team colours</div>
  <div id="teams"></div>
  <div id="scores"></div>
  <button id="replayBtn">Replay battle</button>
  <div id="picker" hidden>
    <div id="pickerBox">
      <b>Choose your team</b>
      <div style="font-size:13px;opacity:.8">You pick once. You can't switch teams later.</div>
      <div id="teamBtns"></div>
      <button id="autoTeam">Pick for me (smallest team)</button>
    </div>
  </div>
  <script src="palette.js"></script>
  <script src="rasterizer.js"></script>
  <script src="client.js"></script>
  <script src="viewport.js"></script>
  <script src="replay.js"></script>
</body>
</html>
